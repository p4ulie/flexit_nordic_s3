{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "flexit-exporter.labels" . | nindent 4 }}
spec:
  groups:
    - name: flexit
      rules:
        - alert: FlexitUnreachable
          expr: flexit_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The Flexit unit has not answered BACnet reads for 15 minutes.
        - alert: FlexitStale
          expr: time() - flexit_last_success_timestamp_seconds > 600 and flexit_up == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The Flexit exporter has no successful read for over 10 minutes, so its read loop may have stalled.
        - alert: FlexitFilterChange
          expr: flexit_air_filter_polluted == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The Flexit air filter is due for a change; reset the filter timer on the unit afterwards.
        - alert: FlexitSupplyAirCold
          expr: flexit_supply_air_temperature < 15
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Flexit supply air is below 15 C, so the heater or the heat recovery has probably failed.
{{- end }}
