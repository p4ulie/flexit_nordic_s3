{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-dashboard
  labels:
    {{- include "flexit-exporter.labels" . | nindent 4 }}
    {{- toYaml .Values.dashboard.labels | nindent 4 }}
  annotations:
    {{- toYaml .Values.dashboard.annotations | nindent 4 }}
data:
  flexit.json: |-
    {{- .Files.Get "dashboards/flexit.json" | nindent 4 }}
{{- end }}
