[tools]
python = "3.12"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = { path = ".env", tools = true }  # unit address etc., git-ignored; see .env.example

[tasks.install]
run = "uv pip install -r requirements.txt"

[tasks.read]
run = "python flexit.py"

[tasks.tui]
run = "python tui.py"

[tasks.exporter]
run = "python exporter.py"
