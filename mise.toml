[tools]
python = "3.12"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = { path = ".env", tools = true }  # unit address etc., git-ignored; see .env.example

[tasks.install]
run = "uv pip install -r requirements.txt -r requirements-dev.txt"

[tasks.test]
run = "uv run --with-requirements requirements.txt --with-requirements requirements-dev.txt python -m pytest -q tests/"

[tasks.read]
run = "python -m flexit_nordic.flexit"

[tasks.tui]
run = "python -m flexit_nordic.tui"

[tasks.exporter]
run = "python -m flexit_nordic.exporter"

[tasks."image:build"]
run = "docker build -t flexit-exporter:dev ."

# Version comes from Chart.yaml so there is one place to bump it.
[tasks."image:push"]
run = '''
registry=${REGISTRY:-10.34.1.1:30095}
v=$(sed -n 's/^version: *//p' deploy/helm/flexit-exporter/Chart.yaml | tr -d '"')
[ -n "$v" ] || { echo "no version: in deploy/helm/flexit-exporter/Chart.yaml" >&2; exit 1; }
docker build -t "$registry/flexit-exporter:$v" . && docker push "$registry/flexit-exporter:$v"
'''
